name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository or publishes anything.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # candi-octomap-node has zero dependencies — pure Rust on std — so the
  # occupancy map, the PointCloud2 parser and the palette can all be tested
  # in CI without MuJoCo, without a GPU and without ROS 2. That covers the
  # logic most likely to break silently.
  test-mapping:
    name: Test the mapping crate (no external deps)
    runs-on: ubuntu-latest
    steps:
      # Both repositories, side by side, because the workspace manifest refers
      # to octomap-core by relative path. Cargo reads every member's manifest
      # even for a single-crate command, so without the sibling checkout
      # nothing here resolves.
      #
      # Third-party actions are pinned to a full commit SHA rather than a tag:
      # a tag can be moved to point at different code, a SHA cannot. The
      # trailing comment records which release each SHA corresponds to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: scan_candi_with_octomap_rust
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Shannon-Dynamics/octo_map_rust
          path: octo_map_rust
          # While that repository is private this needs a token with read
          # access to it; once it is public, no credentials are required.
          # token: ${{ secrets.OCTO_MAP_RUST_READ_TOKEN }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Required with a pinned SHA: the action normally reads the toolchain
          # from the ref name, and a SHA does not name one.
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt -p candi-octomap-node -- --check
        working-directory: scan_candi_with_octomap_rust
      - name: Run Clippy
        run: cargo clippy -p candi-octomap-node --all-targets -- -D warnings
        working-directory: scan_candi_with_octomap_rust
      - name: Run tests
        run: cargo test -p candi-octomap-node
        working-directory: scan_candi_with_octomap_rust
      - name: Build documentation
        run: cargo doc -p candi-octomap-node --no-deps
        working-directory: scan_candi_with_octomap_rust
        env:
          RUSTDOCFLAGS: -D warnings

  # candi-sim is deliberately not built here. It pulls mujoco-rs, which
  # downloads MuJoCo and links an OpenGL context, and it depends on
  # octomap-core by path, which needs the octo_map_rust checkout beside this
  # repository. ros2/ additionally needs a sourced ROS 2 Jazzy installation for
  # r2r to generate its message bindings. All of it is verified locally — see
  # docs/04-running.md — rather than faked in CI.
  #
  # The commands to add once those prerequisites can be provisioned:
  #     cargo fmt --all -- --check
  #     cargo clippy --workspace --all-targets -- -D warnings
  #     cargo test --workspace
  # with MUJOCO_DOWNLOAD_DIR set at build time and the MuJoCo library directory
  # on the loader path at run time. All three pass locally.

  shell-scripts:
    name: Shell scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Syntax-check every script
        run: |
          set -eu
          for f in ros2/*.sh; do
            bash -n "$f"
            echo "ok  $f"
          done

  docs:
    name: Check documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every referenced local file exists
        run: |
          set -uo pipefail
          # Relative links are resolved against the directory of the file that
          # contains them, so each markdown file is scanned separately. The
          # results go to a file rather than into a pipe: a `while` on the right
          # of a pipe runs in a subshell, and a flag set inside it is lost.
          : > /tmp/broken.txt
          find README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md \
               ROADMAP.md docs media assets ros2 \
               -name '*.md' -type f > /tmp/md.txt
          while read -r file; do
            dir=$(dirname "$file")
            grep -oE '\]\([^)#]+\)' "$file" \
              | sed -E 's/^\]\(//; s/\)$//' \
              | grep -vE '^(https?:|mailto:)' \
              | while read -r target; do
                  [ -e "$dir/$target" ] || echo "$file -> $target" >> /tmp/broken.txt
                done
          done < /tmp/md.txt
          if [ -s /tmp/broken.txt ]; then
            echo "Broken local links:"
            cat /tmp/broken.txt
            exit 1
          fi
          echo "All local documentation links resolve."
